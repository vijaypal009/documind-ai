<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuMind AI - Document Intelligence & RAG</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Markdown Parser for Clean AI Output -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="logo-group">
      <span class="badge">DOC</span>
      <h1>DocuMind <span class="version">v1.0</span></h1>
      <span class="author-credit">by <a href="https://github.com/vijaypal009" target="_blank" rel="noopener noreferrer">Vijay Pal</a></span>
    </div>
    
    <div class="header-actions">
      <button id="theme-toggle" class="btn-icon" title="Toggle theme">🌙</button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-layout">
    <!-- Left Sidebar: Document Management -->
    <aside class="sidebar">
      <div class="sidebar-section">
        <h3>DOCUMENT SOURCE</h3>
        
        <input type="file" id="file-input" accept=".pdf,.txt" style="display: none;" />
        
        <div id="drop-zone" class="drop-zone">
          <div class="drop-content">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="12" y1="18" x2="12" y2="12"></line>
              <line x1="9" y1="15" x2="15" y2="15"></line>
            </svg>
            <p id="doc-name">Select PDF or TXT</p>
            <span class="file-hint">Click or drag file here</span>
          </div>
        </div>

        <div class="status-container">
          <span id="index-status" class="status-text">No document loaded</span>
        </div>
      </div>
    </aside>

    <!-- Right Side: Query & Grounded Chat -->
    <section class="chat-container">
      <div class="chat-header">
        <h3>QUERY CONSOLE</h3>
      </div>

      <div id="chat-window" class="chat-window">
        <div id="empty-state" class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
          <p>Upload a document to start semantic querying</p>
        </div>
      </div>

      <form id="chat-form" class="chat-input-row">
        <input 
          type="text" 
          id="chat-input" 
          placeholder="Ask a question about the uploaded document..." 
          autocomplete="off" 
        />
        <button type="submit" id="send-btn" class="btn-primary">Ask AI</button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
