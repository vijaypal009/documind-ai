<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuMind - Document Query Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* Dark Theme (Default) */
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-panel: #1b2129;
      --border-color: #30363d;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --text-dim: #6e7681;
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --success: #10b981;
      --danger: #f43f5e;
      --code-bg: #0d1117;
    }

    /* Light Theme */
    body.light-theme {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-panel: #f1f5f9;
      --border-color: #e2e8f0;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --code-bg: #f1f5f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-ui);
      overflow: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .app-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Top Navbar */
    .app-header {
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      background-color: var(--accent-color);
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .brand-name {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.5px;
    }

    .version {
      font-size: 12px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .theme-toggle-btn {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .theme-toggle-btn:hover {
      border-color: var(--accent-color);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-family: var(--font-mono);
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--text-dim);
    }

    .status-indicator.active .status-dot {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .status-indicator.active #statusText {
      color: var(--success);
    }

    /* Main Container */
    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 56px);
      min-height: 0;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 320px;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .panel h2 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .upload-zone {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      position: relative;
      background-color: var(--bg-panel);
      transition: border-color 0.2s, background-color 0.2s;
    }

    .upload-zone:hover {
      border-color: var(--accent-color);
    }

    .upload-zone input[type='file'] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .upload-prompt {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .btn {
      width: 100%;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      margin-top: 12px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--bg-panel);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }

    .context-panel {
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }

    .meta-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .meta-item label {
      color: var(--text-muted);
    }

    .meta-item span {
      font-family: var(--font-mono);
      color: var(--text-main);
    }

    /* Content Area */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      height: 100%;
      background-color: var(--bg-primary);
      position: relative;
    }

    .console-header {
      height: 56px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
      background-color: var(--bg-secondary);
    }

    .console-header h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .active-doc-tag {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent-color);
    }

    .chat-container {
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .chat-container::-webkit-scrollbar,
    .sidebar::-webkit-scrollbar {
      width: 8px;
    }

    .chat-container::-webkit-scrollbar-track,
    .sidebar::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }

    .chat-container::-webkit-scrollbar-thumb,
    .sidebar::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    .query-entry {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex-shrink: 0;
    }

    .query-display {
      font-size: 15px;
      color: var(--accent-color);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .response-display {
      color: var(--text-main);
      font-size: 14px;
      line-height: 1.7;
    }

    .response-display h1,
    .response-display h2,
    .response-display h3,
    .response-display h4 {
      color: var(--text-main);
      margin: 14px 0 8px 0;
      font-weight: 600;
    }

    .response-display p {
      margin-bottom: 10px;
    }

    .response-display ul,
    .response-display ol {
      padding-left: 20px;
      margin-bottom: 12px;
    }

    .response-display li {
      margin-bottom: 6px;
    }

    .response-display strong {
      color: var(--accent-color);
    }

    .response-display hr {
      border: 0;
      border-top: 1px solid var(--border-color);
      margin: 16px 0;
    }

    .grounding-box {
      background-color: var(--code-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      margin-top: 8px;
    }

    .grounding-title {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .source-node {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 6px;
      line-height: 1.4;
    }

    /* Bottom Input Bar */
    .query-bar {
      border-top: 1px solid var(--border-color);
      background-color: var(--bg-secondary);
      padding: 16px 24px;
      flex-shrink: 0;
    }

    .input-group {
      display: flex;
      gap: 12px;
    }

    .input-group input {
      flex: 1;
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px 16px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: var(--accent-color);
    }

    .input-group button {
      width: 120px;
      margin-top: 0;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <header class="app-header">
      <div class="header-left">
        <div class="brand">
          <span class="badge">DOC</span>
          <span class="brand-name">DocuMind</span>
          <span class="version">v1.0</span>
        </div>
      </div>
      <div class="header-right">
        <button id="themeToggleBtn" class="theme-toggle-btn">
          <span id="themeIcon">☀️</span>
          <span id="themeLabel">Light Mode</span>
        </button>
        <div id="statusIndicator" class="status-indicator">
          <span class="status-dot"></span>
          <span id="statusText">No Index Loaded</span>
        </div>
      </div>
    </header>

    <div class="main-container">
      <aside class="sidebar">
        <section class="panel">
          <h2>DOCUMENT SOURCE</h2>
          <div class="upload-zone" id="dropZone">
            <input type="file" id="fileInput" accept=".pdf,.txt" />
            <div class="upload-prompt">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="12" y1="18" x2="12" y2="12"></line>
                <line x1="9" y1="15" x2="15" y2="15"></line>
              </svg>
              <span id="fileNameDisplay">Select PDF or TXT</span>
            </div>
          </div>
          <button id="uploadBtn" class="btn btn-secondary" disabled>Index Document</button>
        </section>

        <section class="panel context-panel" id="contextPanel" style="display: none;">
          <h2>ACTIVE CONTEXT</h2>
          <div class="meta-item">
            <label>File</label>
            <span id="metaFilename">-</span>
          </div>
          <div class="meta-item">
            <label>Chunks</label>
            <span id="metaChunks">-</span>
          </div>
          <div class="meta-item">
            <label>Indexed At</label>
            <span id="metaTime">-</span>
          </div>
        </section>
      </aside>

      <main class="content-area">
        <div class="console-header">
          <h2>QUERY CONSOLE</h2>
          <span id="activeDocTag" class="active-doc-tag"></span>
        </div>

        <div class="chat-container" id="chatContainer">
          <div class="empty-state" id="emptyState">
            <p>Upload a document and run indexing to query its contents.</p>
          </div>
        </div>

        <div class="query-bar">
          <form id="queryForm">
            <div class="input-group">
              <input
                type="text"
                id="queryInput"
                placeholder="Type your question against the index..."
                disabled
                autocomplete="off"
              />
              <button type="submit" id="queryBtn" class="btn btn-primary" disabled>Execute</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
